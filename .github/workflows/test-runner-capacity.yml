name: Measure one Steam runner
on: workflow_dispatch
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python runner-capacity.py
      - uses: actions/upload-artifact@v4
        with:
          name: runner-capacity
          path: capacity.json
          retention-days: 3
  apkpure:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python benchmarks/apkpure/runner-capacity.py
      - uses: actions/upload-artifact@v4
        with:
          name: apkpure-capacity
          path: apkpure-capacity.json
          retention-days: 3
