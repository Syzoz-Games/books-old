name: Probe public Steam query JSON
on:
  workflow_dispatch:
    inputs:
      count:
        description: Bounded result count (1 or 2)
        type: number
        required: true
        default: 2
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Request at most two public query records
        env:
          PROBE_COUNT: ${{ inputs.count }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          MAX_BODY=2000000
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):return None
          result={'status':'failed','credentials_sent':False,'requested_method':'GET','html_requests':0,'server_writes':0,'schema_source':'https://raw.githubusercontent.com/SteamDatabase/Protobufs/master/webui/service_storequery.proto','sort_semantics':'Default numeric sort0 only; release ordering is not claimed','github':{'repository':os.environ.get('GITHUB_REPOSITORY'),'run_id':os.environ.get('GITHUB_RUN_ID'),'sha':os.environ.get('GITHUB_SHA')}}
          started=time.perf_counter()
          try:
           count=int(os.environ.get('PROBE_COUNT','2'))
           if not 1<=count<=2:raise ValueError('Count must be1or2')
           payload={'query_name':'syzoz_bounded_public_query_probe','query':{'start':0,'count':count,'sort':0,'filters':{'released_only':True,'type_filters':{'include_apps':True,'include_games':True}}},'context':{'language':'english','country_code':'US'},'data_request':{'include_basic_info':True,'include_release':True,'include_platforms':True,'include_assets':True,'include_reviews':True,'include_tag_count':20}}
           result['request']=payload
           url='https://api.steampowered.com/IStoreQueryService/Query/v1/?'+urllib.parse.urlencode({'input_json':json.dumps(payload,separators=(',',':'))})
           result['url']=url
           request=urllib.request.Request(url,headers={'Accept':'application/json','Accept-Encoding':'identity','User-Agent':'SyzozBoundedQueryProbe/1.0'})
           try:response=urllib.request.build_opener(NoRedirect()).open(request,timeout=15)
           except urllib.error.HTTPError as error:response=error
           with response:
            result['http_status']=response.status;result['content_type']=response.headers.get('Content-Type','');raw=response.read(MAX_BODY+1)
           result['request_milliseconds']=round((time.perf_counter()-started)*1000,2);result['response_bytes']=len(raw)
           if len(raw)>MAX_BODY:raise ValueError('Response exceeds bounded body limit')
           result['response_sha256']=hashlib.sha256(raw).hexdigest()
           if 'json' not in result['content_type'].lower():raise ValueError('NonJSON response; no HTML processed')
           doc=json.loads(raw)
           if not isinstance(doc,dict):raise ValueError('JSON root is not an object')
           response=doc.get('response')
           if isinstance(response,dict):
            metadata=response.get('metadata')
            result['response_keys']=list(response)
            for key in ['ids','store_items']:
             rows=response.get(key,[])
             if not isinstance(rows,list) or len(rows)>count:raise ValueError('Provider returned more than bounded requested items')
            if isinstance(metadata,dict) and len(metadata.get('per_result_metadata',[]))>count:raise ValueError('Provider resultmetadata exceeds count')
            result['metadata']=metadata
            result['ids_count']=len(response.get('ids',[]));result['store_items_count']=len(response.get('store_items',[]))
           result['response']=doc
           if result['http_status']!=200:raise ValueError('HTTP access was not granted')
           if not isinstance(response,dict) or not isinstance(response.get('metadata'),dict):raise ValueError('Query metadata was not returned')
           result['status']='json_query_observed'
          except (OSError,ValueError,TypeError) as error:
           result['error']=str(error)[:240] if isinstance(error,(ValueError,TypeError)) else type(error).__name__
          finally:
           result.setdefault('request_milliseconds',round((time.perf_counter()-started)*1000,2))
           Path('query-probe-result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
           print(json.dumps({key:result.get(key) for key in ['status','http_status','request_milliseconds','ids_count','store_items_count','metadata','error']}))
          raise SystemExit(0 if result['status']=='json_query_observed' else 1)
          PY
      - name: Save query response and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-query-json-probe
          path: query-probe-result.json
          if-no-files-found: error
          retention-days: 7
