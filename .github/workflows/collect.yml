name: Collect Steam catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: read
concurrency:
  group: steam-production-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Resume anonymous collection
        env:
          STEAM_SYNC_TOKEN: ${{ secrets.STEAM_SYNC_TOKEN }}
          STEAM_SYNC_URL: https://syzoz.com/game-explorer/steam-sync.php
        run: python collect.py --seconds 21600 --batch 1000
